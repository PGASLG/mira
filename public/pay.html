<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira — ชำระเงิน (ตัวอย่าง)</title>
<script src="loader.js"></script>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--ink);border-radius:8px;padding:26px 22px;text-align:left}
.demo{display:inline-block;background:var(--yellow);color:#0e1b33;font-weight:700;font-size:12px;border-radius:4px;padding:3px 10px;letter-spacing:.06em}
img{height:30px;margin:16px 0 6px;display:block}
.amt{font-family:"Newsreader","Noto Serif Thai",Georgia,serif;font-size:48px;font-weight:600;margin:6px 0;font-variant-numeric:tabular-nums lining-nums}
.m{color:var(--mute);font-size:14px}
.steps{margin:18px 0;display:grid;gap:0;border-top:1px solid var(--line)}
.st{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:15px;padding:10px 0;border-bottom:1px solid var(--line)}
.st i{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px;flex:none}
.st.on{color:var(--ink);font-weight:600}.st.on i{border-color:var(--blue);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
.st.ok{color:var(--ink)}.st.ok i{background:var(--green);border-color:var(--green);color:#fff;animation:none}
@keyframes sp{to{transform:rotate(360deg)}}
.big{width:72px;height:72px;border-radius:6px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:40px;margin:14px 0}
.btn{display:block;border-radius:6px;padding:12px 20px;font:inherit;font-weight:600;text-decoration:none;background:var(--blue);color:#fff;border:1px solid var(--blue);margin-top:18px;text-align:center}
.err{color:var(--red)}
</style>
</head>
<body>
<div class="box">
  <span class="demo">DEMO ONLY</span>
  <div><img src="assets/logo-h.png" alt="Mira"></div>
  <div class="m" id="what"></div>
  <div class="amt" id="amt">฿0</div>
  <div id="main"></div>
  <p class="m" id="fine"></p>
</div>
<script>
const q=new URLSearchParams(location.search), id=q.get("id")||"", amt=Math.round(+q.get("amt")||0), method=q.get("m")==="card"?"card":"pp", sid=q.get("session_id");
let lang="th"; try{lang=localStorage.getItem("mira_lang")||"th"}catch(e){}
const T={th:{pp:"PromptPay (ตัวอย่าง)",card:"บัตร / PayPal ผ่าน Stripe (ตัวอย่าง)",s:["เปิดแอปธนาคาร","ตรวจสอบรายการ","ยืนยันการชำระเงิน"],done:"เสร็จสมบูรณ์",added:"เติมเงินเข้าบัญชีจำลองแล้ว",back:"กลับไปที่ Mira",bad:"ลิงก์ไม่ถูกต้อง",unpaid:"ยังไม่ได้ชำระเงิน",nostripe:"ยังไม่ได้เชื่อมต่อ Stripe บนเซิร์ฟเวอร์ จึงแสดงหน้าตัวอย่างแทน",fine:"ตัวอย่างเท่านั้น ไม่มีการตัดเงินจริง พอร์ตของ Mira เป็นพอร์ตจำลอง"},
 en:{pp:"PromptPay (demo)",card:"Card / PayPal via Stripe (demo)",s:["Open bank app","Check the details","Confirm payment"],done:"Complete",added:"Money added to your paper account",back:"Back to Mira",bad:"This link is not valid",unpaid:"Payment was not completed",nostripe:"Stripe is not connected on the server yet, so this demo screen is shown instead.",fine:"Demo only. No real money is taken. Mira is a paper portfolio."}}[lang]||{};
const $=i=>document.getElementById(i);
$("what").textContent=T[method]; $("amt").textContent="฿"+amt.toLocaleString("en-US"); $("fine").textContent=T.fine;
function finish(){
  fetch("/api/topup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,amt})}).catch(()=>{});
  try{localStorage.setItem("mira_pay_"+id,String(amt))}catch(e){}
  $("main").innerHTML=`<div class="big">✓</div><b style="font-size:22px">${T.done}</b><div class="m">${T.added}</div><a class="btn" href="/dashboard">${T.back}</a>`;
}
function fail(msg){ $("main").innerHTML=`<p class="err">${msg}</p><a class="btn" href="/dashboard">${T.back}</a>`; }
function run(){
  const el=$("main"); el.innerHTML='<div class="steps">'+T.s.map((s,i)=>`<div class="st" id="s${i}"><i>${i+1}</i><span>${s}</span></div>`).join("")+"</div>";
  let i=0; const go=()=>{ if(i>0){const p=$("s"+(i-1)); p.className="st ok"; p.firstChild.textContent="✓";}
    if(i>=T.s.length){ setTimeout(finish,400); return; } $("s"+i).className="st on"; i++; setTimeout(go,1100); }; go();
}
if(!/^[a-z0-9]{6,40}$/.test(id)||!(amt>=1&&amt<=100000)) fail(T.bad);
else if(method==="card"&&sid){
  fetch("/api/checkout?session_id="+encodeURIComponent(sid)).then(r=>r.json()).then(j=>j.paid?finish():fail(T.unpaid)).catch(()=>fail(T.unpaid));
} else { if(method==="card") $("what").textContent=T.nostripe; run(); }
</script>
</body>
</html>
