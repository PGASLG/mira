<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mira — คุยกับ June</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
<script src="loader.js"></script>
<style>
:root{--blue:#1e7bff;--navy:#0b3a93;--cyan:#4cc9ff;--yellow:#fdb913;--green:#12a15c;--red:#c43d3d;--sky:#e8f2ff;--bg:#f4f8ff;--card:#fff;--ink:#0f1f3d;--mute:#5b6b88;--line:#dbe5f5}
@media (prefers-color-scheme:dark){:root{--bg:#0a1226;--card:#121c36;--ink:#eaf1ff;--mute:#9fb0d0;--line:#24345a;--sky:#14264d;--green:#4cd790;--red:#ff8585}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Prompt",system-ui,sans-serif;overflow:hidden}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px}
header .logo{height:34px;width:auto;display:block}
.hr{display:flex;gap:8px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 13px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none}
.pill.sm{padding:4px 11px;font-size:12.5px;font-weight:600}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:14px;padding:0 16px 12px}
@media (min-width:960px){.main{grid-template-columns:1fr 340px}}

/* chat */
.chat{min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.who{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.who .tools{margin-left:auto;display:flex;gap:6px}
.av{width:40px;height:40px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;font:600 22px/1 "Newsreader","Noto Serif Thai",Georgia,serif}
.who b{display:block;line-height:1.2;font-family:"Newsreader","Noto Serif Thai",Georgia,serif;font-size:19px;font-weight:600}
.who small{color:var(--mute);font-size:12.5px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#aab4c8;display:inline-block}
.dot.on{background:var(--green)}.dot.busy{background:var(--yellow)}
.msgwrap{position:relative;flex:1;min-height:0;display:flex}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.toend{position:absolute;right:14px;bottom:10px;width:38px;height:38px;border-radius:6px;border:1px solid var(--ink);background:var(--card);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
.toend[hidden]{display:none}
.who{flex-wrap:wrap}
.histp{position:absolute;inset:0;z-index:2;background:var(--card);overflow-y:auto;padding:16px}
.histp[hidden]{display:none}
.histp h2{font:600 17px "Newsreader","Noto Serif Thai",Georgia,serif;margin:0 0 8px}
.hrow{display:flex;gap:8px;align-items:stretch;border-top:1px solid var(--line)}
.hrow .open{flex:1;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:10px 0;cursor:pointer}
.hrow .open small{display:block;color:var(--mute);font-size:12.5px}
.hrow .open.cur b{color:var(--blue)}
.hrow .del{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
.m{max-width:84%;padding:10px 14px;border-radius:8px;white-space:pre-wrap;word-wrap:break-word;animation:pop .25s both}
.m.j{align-self:flex-start;background:transparent;border-left:2px solid var(--ink);border-radius:0;padding:4px 0 4px 14px;max-width:88%}
.m.u{align-self:flex-end;background:var(--blue);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;display:flex;gap:5px;border-left:2px solid var(--ink);padding:8px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bn 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
.change{align-self:stretch;border:1px solid var(--green);border-left-width:3px;background:transparent;border-radius:8px;padding:10px 14px;font-size:14.5px;display:flex;justify-content:space-between;gap:10px;align-items:center;animation:pop .25s both}
.change b{color:var(--green)}
.change button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex:none}
.change button:disabled{opacity:.6;cursor:default}
.err,.notice{align-self:stretch;border:1px solid var(--line);border-left:3px solid var(--yellow);background:var(--warn-bg,#fbf3dc);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:14px;display:flex;gap:10px;justify-content:space-between;align-items:center;animation:pop .25s both}
.notice{font-size:13.5px;color:var(--mute);border-color:var(--line);background:transparent}
.err button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.chips button:hover{border-color:var(--ink)}
.box{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);align-items:flex-end}
.box textarea{flex:1;resize:none;max-height:120px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 14px;font:inherit;outline:0}
.box textarea:focus{border-color:var(--blue)}
.ib{width:44px;height:44px;border-radius:8px;border:0;flex:none;display:grid;place-items:center;cursor:pointer}
.ib.send{background:var(--blue);color:#fff}
.ib.mic{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.ib.mic.on{background:var(--red);color:#fff;animation:pulse 1.4s infinite}
.ib.att{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.attchip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:13px}
.attchip[hidden]{display:none}
.attchip b{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attchip button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:2px 8px;font:inherit;cursor:pointer}
.attchip small{flex-basis:100%;color:var(--mute);line-height:1.5}
@keyframes pulse{50%{opacity:.7}}
.ib:disabled{opacity:.5;cursor:default}

/* info panel */
.side{display:none;flex-direction:column;gap:12px;overflow-y:auto}
@media (min-width:960px){.side{display:flex}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font:600 17px "Newsreader","Noto Serif Thai",Georgia,serif;margin:0 0 8px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--mute)}
.kv b{font:600 20px "Newsreader","Noto Serif Thai",Georgia,serif;font-variant-numeric:tabular-nums lining-nums}
.flash{animation:flash 1.2s}
@keyframes flash{0%{background:rgba(253,185,19,.4)}100%{background:transparent}}
.up{color:var(--green)}.down{color:var(--red)}
.small{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.mobinfo{display:block;padding:0 16px 8px}
@media (min-width:960px){.mobinfo{display:none}}
.mobinfo details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.mobinfo summary{cursor:pointer;font-weight:600;font-size:14.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <a href="/dashboard" target="_top"><img class="logo" src="assets/logo-h.png" alt="Mira"></a>
    <div class="hr"><a class="pill" href="/dashboard.html" id="back"></a><button class="pill" id="lang">EN</button></div>
  </header>

  <div class="mobinfo"><details><summary id="m_sum"></summary><div id="m_info"></div></details></div>

  <div class="main">
    <section class="chat">
      <div class="who">
        <div class="av">M</div>
        <div><b>June</b><small><span class="dot" id="dot"></span><span id="status"></span></small></div>
        <div class="tools"><button type="button" class="pill sm" id="newc"></button><button type="button" class="pill sm" id="histb"></button><button type="button" class="pill sm" id="copy"></button><button type="button" class="pill sm" id="clear"></button></div>
      </div>
      <div class="msgwrap">
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <button type="button" class="toend" id="toend" hidden aria-label="latest">↓</button>
        <div class="histp" id="histp" hidden></div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="attchip" id="attchip" hidden><b id="attname"></b><button type="button" id="attx"></button><small id="attnote"></small></div>
      <form class="box" id="form">
        <button type="button" class="ib att" id="att" aria-label="attach"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 7"/></svg></button>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp,application/pdf,text/plain,text/csv" hidden>
        <button type="button" class="ib mic" id="mic" aria-label="voice"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
        <textarea id="inp" rows="1" autocomplete="off"></textarea>
        <button class="ib send" id="send" aria-label="send"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14-7-5 15-3-6-6-2z"/></svg></button>
      </form>
    </section>

    <aside class="side">
      <div class="panel"><h2 id="p_h"></h2><div id="p_info"></div><p class="small" id="p_note"></p></div>
      <div class="panel"><h2 id="c_h"></h2><p class="small" id="c_t" style="margin:0"></p></div>
    </aside>
  </div>
</div>

function whyBits(p){ // easy-words reasons, same rules as onboarding: debt / thin cash / short horizon / nervous = lower; long horizon / calm / experience = higher

  if(p.horizon==="short") low.push(th?"เป้าหมายอยู่ในระยะสั้น":"your goal is short-term");
  if(p.react==="sell") low.push(th?"ถ้าตลาดตก คุณอาจกังวลและอยากขาย":"a market drop might make you nervous");
  if(p.horizon==="long") up.push(th?"เป้าหมายอยู่ในระยะยาว":"your goal is long-term");

let turn={mut:false,notices:[]};
const resetTurn=()=>{ turn={mut:false,notices:[]}; };
// past-tense "I changed it" claims; "ตั้งไว้ที่ ..." only describes the current value so it is not a claim by itself
const CLAIM_TH=/(ตั้ง(ไว้)?ให้|ตั้งไว้.{0,15}แล้ว|เปลี่ยน(แล้ว|ให้)|ปรับ(แล้ว|ให้)|แก้(แล้ว|ให้)|เติม(เงิน)?(ให้)?แล้ว|เพิ่ม(เงิน)?(ให้)?แล้ว|ทำให้แล้ว|เรียบร้อย|บันทึก(แล้ว|ให้))/;
const ASKING_TH=/(ไหม|มั้ย|หรือเปล่า|หรือไม่|\?|ดีคะ|ดีครับ)/;   // offers like "ให้ปรับให้ไหมคะ" are not claims
const CLAIM_EN=/\b(done|all set|i(?:'ve| have)? (?:set|changed|updated|added|adjusted|raised|lowered)|(?:has|have) been (?:set|changed|updated|added|adjusted)|is now (?:set|changed|updated)|now set to|successfully (?:set|changed|updated|added))\b/i;
const claimsChange=msg=>(CLAIM_TH.test(msg)&&!(ASKING_TH.test(msg)&&!/แล้ว|เรียบร้อย/.test(msg)))||CLAIM_EN.test(msg);
function guard(msg){
  if(turn.mut||!claimsChange(msg)) return;
  const el=mkNotice(T().notReal); turn.notices.push(el); hist.push({k:"n",t:T().notReal}); persist(); scroll(false);
}
function markMutation(){ turn.mut=true; turn.notices.forEach(el=>{ el.remove(); const i=hist.map(e=>e.k).lastIndexOf("n"); if(i>=0) hist.splice(i,1); }); turn.notices=[]; persist(); }

  try{ const h=fx&&fx.horizons&&fx.horizons["30"], r=h&&h.ranges&&h.ranges["80"];
    if(fx&&fx.spot&&r) out.push(`USD/THB spot ${fx.spot} (as of ${fx.as_of}). 30-day 80% range ${r.rate_low} to ${r.rate_high}. Ranges only, never a direction call.`); }catch(e){}

}

  if(isZero()) p.push("The user has ฿0 in the plan right now. Be warm, guide them to add some simulated money first (use add_money only if they ask), and explain the plan in easy words.");

  else if(consentOn()) p.push("The user has not completed the onboarding questions (or declined sharing them). Offer once to answer a few questions at /onboarding.html so you can personalise; do not invent their answers.");
  if(!consentOn()) p.push("The user turned off sharing plan numbers. Do not guess them and do not change the plan.");

  const others=chats.filter(c=>c.id!==curId).slice(0,3);
  if(others.length) p.push("Earlier separate chats with this user (newest first, memory only):\n"+others.map(c=>"- "+new Date(c.ts||0).toISOString().slice(0,10)+": "+c.h.filter(e=>e.k==="m"||e.k==="c").slice(-6).map(e=>(e.k==="c"?"[change] ":e.w==="u"?"User: ":"June: ")+e.t.slice(0,160)).join(" / ")).join("\n"));

}

          // text chat: drop the agent's own opening line, the page already shows a ฿0-aware hello
          // the opening line can land just before or just after our first send; a real reply cannot arrive within ~1.2s of connect
          if(!voiceStart&&!sawAgent){ sawAgent=true; if(!sent||Date.now()-connectedAt<1200) return; }
          if(!voiceStart&&!sent) return;
          hideTyping(); persistHello(); addMsg(message,"j"); guard(message); },
        onModeChange:({mode:m})=>{ if(alive()&&m==="speaking") hideTyping(); },
        onStatusChange:({status})=>{ if(!alive()) return;
          if(status==="connected"&&state==="conn") setStatus(voiceStart?"voice":"on");
          if(status==="disconnected") dropped(my); },
        onError:(e)=>{ if(!alive()) return; hideTyping(); console.warn("EL error",e); },
        onUnhandledClientToolCall:(c)=>{ console.warn("EL unhandled tool",c); } };
      if(voice){ cfg.connectionType="webrtc"; } else { cfg.connectionType="websocket"; cfg.textOnly=true; cfg.overrides={conversation:{textOnly:true}}; }
      const c=await Conversation.startSession(cfg); connectedAt=Date.now();
      if(!alive()){ try{ await c.endSession(); }catch(e){} return null; }
      conv=c; mode=voice?"voice":"text"; retryN=0; setStatus(voice?"voice":"on");
      try{ conv.sendContextualUpdate(fullContext()); }catch(e){}
      return conv;
    }catch(e){ console.warn(e); addErr(T().fail,T().retry,()=>{ if(lastUser) send(lastUser,true); else start(false); }); setStatus("off"); conv=null; return null; }
    finally{ if(window.MiraLoading) MiraLoading.hide(); }
  })();
  try{ return await starting; } finally{ starting=null; }
}
// connection dropped by the server/network (not by us)
function dropped(my){
  if(cur!==my) return;
  const wasVoice=mode==="voice"; conv=null; cur=null; hideTyping(); micOn(false); setStatus("off");
  if(wasVoice) return;                         // voice: user taps the mic again
  if(retryN>=3){ addErr(T().fail,T().retry,()=>{ retryN=0; start(false); }); return; }
  const wait=[1500,3000,6000][retryN++]; setStatus("conn");
  if(retryN===1) addErr(T().dropped);
  clearTimeout(retryTimer);
  retryTimer=setTimeout(async()=>{ const c=await start(false); if(!c&&!conv){ if(retryN>=3){ setStatus("off"); } else dropped({}); } },wait);
}
async function endConv(){ clearTimeout(retryTimer); retryN=0; const c=conv; conv=null; cur=null; try{ if(c) await c.endSession(); }catch(e){} }

async function send(text,isRetry,file){
  text=(text||"").trim(); if((!text&&!file)||state==="conn") return false;
  lastUser=text; lastFile=file||null;
  if(!conv){ const c=await start(false); if(!c) return false; }
  persistHello(); resetTurn(); sent=true;
  if(!isRetry) addMsg(file?(T().attsent+": "+file.name+(text?"\n"+text:"")):text,"u");
  showTyping();
  try{
    if(file){                                    // read the file into text (OCR for images/scanned PDFs), then send the text to June
      let doc="";
      try{ doc=(await readFileText(file)).trim(); }
      catch(e){
        console.warn(e); hideTyping();
        if(e&&e.code==="not_configured"){ addErr(T().ocrcfg); return false; }
        addErr(e&&e.code==="rate_limited"?T().ocrbusy:T().upfail,T().resend,()=>send(text,true,file)); return false;
      }
      if(!doc){ hideTyping(); addErr(T().ocrempty); return false; }
      conv.sendUserMessage(T().ocrhead(file.name)+"\n"+doc+"\n\n"+(text||T().attdef));
    } else conv.sendUserMessage(text);
  }catch(e){ hideTyping(); addErr(T().sent,T().resend,()=>send(text,true,file)); }
  return true;
}
// ---- turn an attached file into text: images and scanned PDFs go through /api/ocr (Typhoon OCR), text files are read directly ----
function blobToImg(b){ return new Promise((ok,no)=>{ const u=URL.createObjectURL(b), i=new Image(); i.onload=()=>{ URL.revokeObjectURL(u); ok(i); }; i.onerror=no; i.src=u; }); }
function toJpeg(src,w,h){ const k=Math.min(1,1600/Math.max(w,h)), c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
  const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(src,0,0,c.width,c.height); return c.toDataURL("image/jpeg",0.85); }
async function ocrImage(dataUrl){
  const r=await fetch("/api/ocr",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:dataUrl})});
  const j=await r.json().catch(()=>({})); if(!r.ok){ const e=new Error(j.error||("http_"+r.status)); e.code=j.error||"fail"; throw e; }
  return j.text||"";
}
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function loadPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=PDFJS+"pdf.min.js"; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"; return window.pdfjsLib;
}
async function readFileText(file){
  const CAP=6000;
  if(file.type.indexOf("text/")===0) return (await file.text()).slice(0,CAP);
  if(file.type==="application/pdf"){                       // first 3 pages: real text if the PDF has it, else OCR the page image
    const pdf=await (await loadPdfJs()).getDocument({data:await file.arrayBuffer()}).promise, out=[];
    for(let n=1;n<=Math.min(pdf.numPages,3);n++){
      const pg=await pdf.getPage(n), tx=(await pg.getTextContent()).items.map(i=>i.str).join(" ").trim();
      if(tx.length>=40){ out.push(tx); continue; }
      const vp=pg.getViewport({scale:1.6}), c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; out.push(await ocrImage(toJpeg(c,c.width,c.height)));
    }
    return out.join("\n\n").slice(0,CAP);
  }
  const img=await blobToImg(file); return (await ocrImage(toJpeg(img,img.naturalWidth,img.naturalHeight))).slice(0,CAP);
}
// attach: one image / PDF / text file, sent with the next message
const FILE_OK=/^(image\/(png|jpeg|webp)|application\/pdf|text\/(plain|csv))$/, FILE_MAX=10*1048576;
function renderAtt(){
  const t=T(), c=$("attchip"); c.hidden=!pendingFile; if(!pendingFile) return;
  $("attname").textContent=pendingFile.name+" ("+Math.max(1,Math.round(pendingFile.size/1024))+" KB)"; $("attx").textContent=t.attx; $("attnote").textContent=t.attnote;
}
$("att").onclick=()=>{ if(state!=="conn") $("file").click(); };
$("file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  if(!FILE_OK.test(f.type)){ addErr(T().badfile); return; }
  if(f.size>FILE_MAX){ addErr(T().bigfile); return; }
  pendingFile=f; renderAtt(); $("inp").focus();
});
$("attx").onclick=()=>{ pendingFile=null; renderAtt(); };
$("form").addEventListener("submit",e=>{ e.preventDefault(); if(state==="conn") return; const v=$("inp").value; if(!v.trim()&&!pendingFile) return;
  const f=pendingFile; pendingFile=null; renderAtt(); $("inp").value=""; autosize(); send(v,false,f); });
$("inp").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); $("form").requestSubmit(); } });
function autosize(){ const i=$("inp"); i.style.height="auto"; i.style.height=Math.min(120,i.scrollHeight)+"px"; }
$("inp").addEventListener("input",autosize);
$("chips").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) send(b.textContent); });
$("mic").onclick=async()=>{
  if(state==="conn") return;
  if(conv&&mode==="voice"){ await endConv(); micOn(false); setStatus("off"); return; }
  await endConv(); micOn(true); const c=await start(true); if(!c) micOn(false);
};
function helloText(){ const t=T(); if(TRACK&&t.helloT[TRACK]) return t.helloT[TRACK]; if(TOPIC&&t.helloT[TOPIC]) return t.helloT[TOPIC]; const pp=getProfile(); if(pp){ const h=profileHello(pp); if(h) return h; } return isZero()?t.hello0:t.hello; }
function showHello(){ localHello=mkMsg(helloText(),"j"); scroll(true); }
$("lang").onclick=()=>{ lang=lang==="th"?"en":"th"; try{localStorage.setItem("mira_lang",lang)}catch(e){}
  if(localHello) localHello.textContent=helloText(); renderText();
  pushContext("The user switched the interface language to "+(lang==="th"?"Thai":"English")+". Reply in that language."); };

// new chat / history
async function openChat(id){
  hideTyping(); await endConv(); resetTurn(); localHello=null; setStatus("off"); micOn(false); $("histp").hidden=true;
  const c=id&&chats.find(x=>x.id===id); curId=c?c.id:""; hist=c?c.h.filter(e=>e&&typeof e.t==="string"):[];
  persist(); $("msgs").innerHTML=""; if(hist.length) restore(); else showHello(); renderText();
}
function renderHist(){
  const t=T(), box=$("histp"); box.innerHTML=""; const h=document.createElement("h2"); h.textContent=t.histT; box.appendChild(h);
  const list=chats.filter(c=>c.h.some(e=>e.k==="m"));
  if(!list.length){ const p=document.createElement("p"); p.className="small"; p.textContent=t.noHist; box.appendChild(p); return; }
  list.forEach(c=>{ const row=document.createElement("div"); row.className="hrow";
    const o=document.createElement("button"); o.type="button"; o.className="open"+(c.id===curId?" cur":"");
    const b=document.createElement("b"); b.textContent=(c.title||"…")+(c.id===curId?" · "+t.cur:""); const sm=document.createElement("small");
    sm.textContent=new Date(c.ts||0).toLocaleString(lang==="th"?"th-TH":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    o.append(b,sm); o.onclick=()=>openChat(c.id);
    const d=document.createElement("button"); d.type="button"; d.className="del"; d.textContent=t.del;
    d.onclick=async()=>{ chats=chats.filter(x=>x.id!==c.id); if(c.id===curId){ await openChat(""); } else persist(); renderHist(); };
    row.append(o,d); box.appendChild(row); });
}
$("newc").onclick=()=>{ if(state==="conn") return; openChat(""); };
$("histb").onclick=()=>{ const h=$("histp"); if(h.hidden){ renderHist(); h.hidden=false; } else h.hidden=true; };

// copy / clear
function flashStatus(txt){ const el=$("status"), old=el.textContent; el.textContent=txt; setTimeout(()=>{ el.textContent=old; setStatus(state); },1400); }
$("copy").onclick=async()=>{
  const t=T(), items=hist.filter(e=>e.k==="m"); if(localHello) items.unshift({w:"j",t:localHello.textContent});
  if(!items.length){ flashStatus(t.empty); return; }
  const lines=items.map(e=>(e.w==="u"?t.me:"June")+": "+e.t).join("\n");
  try{ await navigator.clipboard.writeText(lines); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=lines; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove(); }
  flashStatus(t.copied);
};
$("clear").onclick=async()=>{
  if(!hist.length&&!curId) return;
  if(!confirm(T().clearQ)) return;
  chats=chats.filter(c=>c.id!==curId); await openChat("");
};

// keep panel in step when the plan changes on another screen (e.g. top-up) and the user comes back
let lastSig=JSON.stringify(vars());
function resync(){ readLS(); renderText(); const sig=JSON.stringify(vars()); if(sig!==lastSig){ lastSig=sig; pushContext("The user's plan changed outside this chat. Now: "+sig); } }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") resync(); });
window.addEventListener("focus",resync);
window.addEventListener("pageshow",e=>{ if(e.persisted) resync(); });
window.addEventListener("online",()=>{ if(!conv&&state==="off"&&sent){ retryN=0; start(false); } });
window.addEventListener("beforeunload",()=>{ try{conv&&conv.endSession()}catch(e){} });

if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) $("mic").style.display="none";
renderText();
if(hist.length) restore(); else showHello();
</script>
