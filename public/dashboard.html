<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mira — สวัสดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
<script src="loader.js"></script>
<style>
:root{--blue:#1e7bff;--navy:#0b3a93;--cyan:#4cc9ff;--yellow:#fdb913;--green:#12a15c;--red:#c43d3d;--sky:#e8f2ff;--bg:#f4f8ff;--card:#fff;--ink:#0f1f3d;--mute:#5b6b88;--line:#dbe5f5}
@media (prefers-color-scheme:dark){:root{--bg:#0a1226;--card:#121c36;--ink:#eaf1ff;--mute:#9fb0d0;--line:#24345a;--sky:#14264d;--green:#4cd790;--red:#ff8585}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Prompt",system-ui,sans-serif;overflow-x:hidden}
.glow{position:fixed;inset:-20% -10% auto -10%;height:60vh;z-index:0;pointer-events:none;
  background:radial-gradient(60% 60% at 25% 20%,rgba(30,123,255,.20),transparent 70%),radial-gradient(50% 50% at 85% 10%,rgba(253,185,19,.16),transparent 70%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,4%,0) scale(1.06)}}
.page{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 20px 48px}
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;animation:fadeDown .6s both}
nav .logo{height:38px;width:auto;display:block}
.nav-r{display:flex;gap:8px;align-items:center}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.me{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:700}

.hello{margin:18px 0 18px;font-family:"Mali","Prompt",cursive;font-size:clamp(30px,8vw,40px);line-height:1.3;font-weight:700;animation:fadeUp .7s .1s both}
.hello em{font-style:normal;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--blue));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-200% 0}}

.sum{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 20px 50px rgba(11,58,147,.10);animation:fadeUp .7s .2s both}
.sum .lbl{font-size:13px;font-weight:700;color:var(--mute)}
.sum .val{font-size:42px;font-weight:700;color:var(--navy);line-height:1.15;margin:2px 0}
@media (prefers-color-scheme:dark){.sum .val{color:#fff}}
.sum .gain{display:inline-block;font-size:14px;font-weight:700;border-radius:999px;padding:3px 12px}
.up{color:var(--green);background:rgba(18,161,92,.12)} .down{color:var(--red);background:rgba(196,61,61,.12)}
.sum .note{margin:10px 0 0;font-size:12.5px;color:var(--mute)}

h2{font-size:18px;margin:30px 0 12px;font-weight:700;animation:fadeUp .7s .3s both}
.acts{display:grid;gap:10px}
.act{display:grid;grid-template-columns:52px 1fr 20px;gap:14px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;text-align:left;font:inherit;color:inherit;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s;animation:fadeUp .7s both}
.act:nth-child(1){animation-delay:.38s}.act:nth-child(2){animation-delay:.46s}.act:nth-child(3){animation-delay:.54s}.act:nth-child(4){animation-delay:.62s}
.act:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(11,58,147,.12)}
.act:active{transform:scale(.99)}
.ic{width:52px;height:52px;border-radius:16px;background:var(--sky);display:grid;place-items:center}
.ic svg{width:28px;height:28px}
.act.main{background:linear-gradient(135deg,var(--blue),#0f5bd8);border:0;color:#fff;box-shadow:0 8px 22px rgba(30,123,255,.35)}
.act.main .ic{background:rgba(255,255,255,.2)}
.act.main small{color:rgba(255,255,255,.85)}
.act b{display:block;font-size:17px;line-height:1.35}
.act small{display:block;color:var(--mute);font-size:13.5px;line-height:1.45}
.chev{font-size:22px;opacity:.6}
.soon{font-size:11px;font-weight:700;background:var(--yellow);color:#4a3200;border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px}

.soon:empty{display:none}
.fine{margin-top:26px;padding:12px 14px;border-radius:16px;background:var(--sky);color:var(--mute);font-size:12.5px;animation:fadeUp .7s .62s both}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.3s;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* tablet */
@media (min-width:700px){
  .page{max-width:760px}
  .hello{font-size:44px}
  .sum{padding:26px}
  .sum .val{font-size:54px}
  .act{padding:18px 20px}
}
/* desktop: summary on the left, actions on the right */
@media (min-width:1000px){
  .page{max-width:1120px;padding:0 40px 64px}
  nav{padding:22px 0}
  nav .logo{height:46px}
  .layout{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:start;margin-top:36px}
  .hello{font-size:56px;margin:0 0 26px}
  .sum{padding:32px;border-radius:30px}
  .sum .val{font-size:68px}
  .sum .gain{font-size:16px;padding:5px 16px}
  .sum .note{font-size:14px}
  .right h2{margin-top:6px;font-size:22px}
  .acts{gap:14px}
  .act{grid-template-columns:64px 1fr 20px;padding:22px 24px;border-radius:26px}
  .ic{width:64px;height:64px;border-radius:20px}
  .ic svg{width:32px;height:32px}
  .act b{font-size:19px}
  .act small{font-size:14.5px}
  .fine{max-width:520px}
}
@media (min-width:1500px){ .page{max-width:1280px} .hello{font-size:64px} .sum .val{font-size:76px} }

/* nav actions: notifications + settings */
.bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.bell svg{width:22px;height:22px}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.badge[hidden]{display:none}
.setbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--blue);background:var(--card);color:var(--blue);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:14px;text-decoration:none}
.setbtn svg{width:19px;height:19px}
.np{position:fixed;top:64px;right:max(16px,calc(50% - 540px));width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(11,58,147,.22);z-index:20;padding:14px}
.np[hidden]{display:none}
.np h3{margin:0;font-size:17px}
.np .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.np .mark{border:0;background:none;color:var(--blue);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.ni{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:10px 6px;border-top:1px solid var(--line);color:inherit;text-decoration:none;cursor:pointer}
.ni .d{width:36px;height:36px;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-size:16px}
.ni b{display:block;font-size:14.5px;line-height:1.35}
.ni span{color:var(--mute);font-size:13px;line-height:1.4}
.ni.unread{background:rgba(30,123,255,.06)}
.ni.unread b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:6px}
.np .empty{color:var(--mute);font-size:14px;padding:14px 6px}
.np .fn{color:var(--mute);font-size:12px;margin:8px 4px 0}
.loanbar{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;margin-top:14px;padding:14px 16px;border-radius:20px;background:var(--card);border:2px solid var(--yellow)}
.loanbar[hidden]{display:none}
.loanbar.red{border-color:var(--red);background:rgba(196,61,61,.1)}
.loanbar b{display:block;font-size:16px;line-height:1.35}
.loanbar span{color:var(--mute);font-size:13.5px}
.loanbar.red b{color:var(--red)}
.loanbar a{background:var(--blue);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:10px 18px;white-space:nowrap}
.loanbar.red a{background:var(--red)}

/* withdraw */
.wd-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.wd-btn{border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;padding:10px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.wd-btn:hover{background:var(--ink);color:var(--card)}
.wd-btn.dp{background:var(--ink);color:var(--card)}
.wd-btn[disabled]{opacity:.45;cursor:default;background:var(--card);color:var(--ink)}
.wd-hint{color:var(--mute);font-size:13px;align-self:center}
.wd-ov{position:fixed;inset:0;background:rgba(14,27,51,.55);z-index:60;display:grid;place-items:center;padding:16px}
.wd-ov[hidden]{display:none}
.wd-box{background:var(--card);border:1px solid var(--ink);border-radius:10px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.wd-box h3{margin:0 0 4px;font-size:22px}
.wd-box .sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.wd-lbl{font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 6px;display:block}
.wd-num{display:flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:6px;padding:8px 12px;background:var(--card)}
.wd-num span{color:var(--mute);font-weight:600}
.wd-num input{border:0;outline:0;background:transparent;font:inherit;font-size:24px;font-weight:600;width:100%;color:var(--ink)}
.wd-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.wd-chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.wd-warn{border:1px solid var(--ink);border-left:6px solid #b3392b;background:var(--bg);border-radius:6px;padding:12px 14px;margin:14px 0;font-size:14.5px}
.wd-warn b{display:block;margin-bottom:4px}
.wd-warn ul{margin:6px 0 0;padding-left:20px}
.wd-warn li{margin:4px 0}
.wd-phrase{font-weight:700;background:var(--sky);border-radius:4px;padding:2px 6px;user-select:all}
.wd-act{display:flex;gap:10px;margin-top:16px}
.wd-act button{border-radius:6px;padding:12px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.wd-act .cancel{border:1px solid var(--ink);background:transparent;color:var(--ink)}
.wd-act .go{flex:1;border:1px solid #b3392b;background:#b3392b;color:#fff}
.wd-act .go[disabled]{opacity:.4;cursor:default}

/* my money: three places */
.ports{margin-top:16px;border-top:1px solid var(--ink)}
.port{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.port h4{margin:0;font-size:16px}
.port .sub2{color:var(--mute);font-size:13.5px}
.port .amt{font-family:"Newsreader","Noto Serif Thai",serif;font-size:24px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.port .acts2{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.port .acts2 a,.port .acts2 button{border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 12px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.port .acts2 button.p{background:var(--blue);border-color:var(--blue);color:#fff}
.port .acts2 button[disabled]{opacity:.45;cursor:default}
.mv-err{border:1px solid var(--ink);border-left:6px solid #b3392b;background:var(--bg);border-radius:6px;padding:10px 12px;margin-top:12px;font-size:14.5px}
.mv-ok{color:var(--green);font-weight:600;margin-top:12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="page">
  <nav>
    <a href="/dashboard" target="_top"><img class="logo" src="assets/logo-h.png" alt="Mira"></a>
    <div class="nav-r">
      <button class="bell" id="bell" aria-label="Notifications" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 004 0"/></svg><span class="badge" id="badge" hidden>0</span></button>
      <a class="setbtn" href="/settings" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span id="setlbl"></span></a>
      <button class="lang" id="lang">EN</button>
    </div>
  </nav>
  <div class="np" id="np" hidden role="dialog" aria-label="Notifications">
    <div class="top"><h3 id="np_h"></h3><button class="mark" id="np_mark"></button></div>
    <div id="np_list"></div>
    <p class="fn" id="np_fn"></p>
  </div>

  <div class="layout">
  <div class="left">
  <h1 class="hello"><span id="hi"></span> <em id="who"></em></h1>

  <section class="sum">
    <div class="lbl" id="lbl"></div>
    <div class="val" id="val">฿0</div>
    <span class="gain" id="gain"></span>
    <p class="note" id="note"></p>
    <div class="wd-row"><button class="wd-btn dp" id="dp-open"></button><button class="wd-btn" id="wd-open"></button><span class="wd-hint" id="wd-hint"></span></div>
    <div class="ports" id="ports"></div>
  </section>

  <div class="loanbar" id="loanbar" hidden>
    <div><b id="lb_t"></b><span id="lb_s"></span></div>
    <a href="lending.html#loanCard" id="lb_btn"></a>
  </div>

  </div>
  <div class="right">
  <h2 id="h_todo"></h2>
  <div class="acts">
    <a class="act main" href="investment.html">
      <span class="ic"><svg viewBox="0 0 44 44" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 33l10-11 8 6 12-16"/><path d="M28 12h9v9"/></svg></span>
      <span><b id="t1"></b><small id="t1s"></small></span><span class="chev">›</span></a>
    <button class="act" id="june">
      <span class="ic"><svg viewBox="0 0 44 44" fill="none" stroke="#1e7bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h28a3 3 0 013 3v15a3 3 0 01-3 3H20l-8 6v-6H8a3 3 0 01-3-3V13a3 3 0 013-3z"/><path d="M14 18h16M14 24h10"/></svg></span>
      <span><b><span id="t2"></span><span class="soon" id="s1"></span></b><small id="t2s"></small></span><span class="chev">›</span></button>
    <button class="act" id="lend">
      <span class="ic"><svg viewBox="0 0 44 44" fill="none" stroke="#1e7bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="22" r="15"/><path d="M22 13v18M27 17.500c-1-1.500-2.800-2.300-5-2.300-3 0-5 1.400-5 3.600 0 4.800 10 2.400 10 7 0 2.200-2.200 3.600-5 3.600-2.300 0-4.200-.9-5.200-2.500"/></svg></span>
      <span><b><span id="t3"></span><span class="soon" id="s2"></span></b><small id="t3s"></small></span><span class="chev">›</span></button>
    <a class="act" id="lender" href="lender.html">
      <span class="ic"><svg viewBox="0 0 44 44" fill="none" stroke="#1e7bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="22" r="15"/><path d="M22 14v16M16 22h12"/></svg></span>
      <span><b id="t4"></b><small id="t4s"></small></span><span class="chev">›</span></a>
  </div>
  </div>
  </div>

  <p class="fine" id="fine"></p>
</div>

<div class="wd-ov" id="dp-modal" hidden role="dialog" aria-modal="true" aria-labelledby="dp-title">
  <div class="wd-box">
    <h3 id="dp-title"></h3>
    <p class="sub" id="dp-sub"></p>
    <label class="wd-lbl" for="dp-amt" id="dp-lbl"></label>
    <div class="wd-num"><span>&#3647;</span><input id="dp-amt" type="number" inputmode="numeric" min="5" max="100000" step="1"></div>
    <div class="wd-chips" id="dp-chips"></div>
    <p class="sub" id="dp-note" style="margin-top:10px;font-size:12.5px"></p>
    <div class="wd-act"><button class="cancel" id="dp-cancel"></button><button class="go" id="dp-go" disabled></button></div>
  </div>
</div>

<div class="wd-ov" id="wd-modal" hidden role="dialog" aria-modal="true" aria-labelledby="wd-title">
  <div class="wd-box">
    <h3 id="wd-title"></h3>
    <p class="sub" id="wd-sub"></p>
    <label class="wd-lbl" for="wd-amt" id="wd-lblamt"></label>
    <div class="wd-num"><span>&#3647;</span><input id="wd-amt" type="number" inputmode="numeric" min="0" step="100"></div>
    <div class="wd-chips" id="wd-chips"></div>

    <label class="wd-lbl" for="wd-dest" id="wd-lbldest"></label>
    <select id="wd-dest" class="wd-num" style="width:100%;font:inherit;font-size:16px;padding:10px 12px"></select>
    <div id="wd-last-wrap">
      <label class="wd-lbl" for="wd-last" id="wd-lbllast"></label>
      <div class="wd-num"><input id="wd-last" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1234" style="font-size:20px"></div>
      <p class="sub" id="wd-lasthint" style="margin:6px 0 0;font-size:12.5px"></p>
    </div>
    <div class="wd-warn" id="wd-warn"></div>
    <label class="wd-lbl" for="wd-type" id="wd-lbltype"></label>
    <div class="wd-num"><input id="wd-type" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-size:18px"></div>
    <div class="wd-act"><button class="cancel" id="wd-cancel"></button><button class="go" id="wd-go" disabled></button></div>
  </div>
</div>

<div class="wd-ov" id="mv-modal" hidden role="dialog" aria-modal="true" aria-labelledby="mv-title">
  <div class="wd-box">
    <h3 id="mv-title"></h3>
    <p class="sub" id="mv-sub"></p>
    <label class="wd-lbl" for="mv-amt" id="mv-lbl"></label>
    <div class="wd-num"><span>&#3647;</span><input id="mv-amt" type="number" inputmode="numeric" min="0" step="100"></div>
    <div class="wd-chips" id="mv-chips"></div>
    <div id="mv-msg"></div>
    <div class="wd-act"><button class="cancel" id="mv-cancel"></button><button class="go" id="mv-go" style="border-color:var(--blue);background:var(--blue)"></button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const P = window.MIRA_DATA.portfolio;
const I18N = {

function fmt(n){return Math.round(n).toLocaleString("en-US")}
// Money starts at 0. The only money is what the user has added (mira_topup), simulated.
function dca(){
  const W=window.MiraWallet; if(!W) return {value:Math.max(0,+LS("mira_topup","0")||0), put:0, profit:0, pct:0};
  const cash=W.central(), L=W.lending(), principal=L.locked+L.waiting;
  let inv=W.invest(), put=inv;                     // fallback: no growth model loaded
  try{                                             // same maths as the investment page: each lot grows with its track from its date
    const sp=LS("mira_split",""), rk=LS("mira_risk","mid");
    const split=sp!==""&&!isNaN(+sp)?+sp:({low:10,mid:30,high:60}[rk]||30);
    inv=0; put=0;
    for(const t of MC.TRK){ const d=MC.trackValue(t,t==="high"?split/100:1-split/100); inv+=d.value; put+=d.put; }
  }catch(e){ inv=put=W.invest(); }
  const base=put+principal, profit=(inv-put)+L.accrued;
  return {value:cash+inv+L.total, put:base, profit, pct:base>0?profit/base*100:0};
}

$("dp-go").onclick = function(){
  const T = DP[lang], a = Math.round(+$("dp-amt").value || 0);
  if (!(a >= 5 && a <= 100000)) { $("toast").textContent = T.bad; $("toast").classList.add("show"); return; }
  const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  $("dp-go").disabled = true;
  fetch("/api/checkout", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ id, amt:a }) })
    .then(r => r.json()).then(j => {
      if (j.error === "below_stripe_min") { $("toast").textContent = T.below; $("toast").classList.add("show"); $("dp-go").disabled = false; return; }
      // Stripe Checkout cannot run inside the iframe that embeds this page, so leave the frame
      if (j.url) { try { window.top.location.href = j.url; } catch (e) { window.open(j.url, "_blank"); } }
      else location.href = "/pay.html?id=" + id + "&amt=" + a + "&m=card";
    })
    .catch(() => { location.href = "/pay.html?id=" + id + "&amt=" + a + "&m=card"; });
};
// payment finished on pay.html (same browser): credit it once, then show the new balance
function dpScan(){
  try {
    let ids = []; try { ids = JSON.parse(LS("mira_paid_ids", "[]")); } catch (e) {}
    let n = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); if (!k || k.indexOf("mira_pay_") !== 0) continue;
      const id = k.slice(9), a = Math.round(+localStorage.getItem(k));
      if (ids.indexOf(id) < 0 && a >= 1 && a <= 100000) {
        ids.push(id); localStorage.setItem("mira_paid_ids", JSON.stringify(ids.slice(-50)));
        localStorage.setItem("mira_topup", String(avail() + a)); n += a;
      }
      localStorage.removeItem(k);
    }
    if (n > 0) { $("toast").textContent = DP[lang].added(fmt(n)); $("toast").classList.add("show"); setTimeout(() => $("toast").classList.remove("show"), 2800); }
    return n;
  } catch (e) { return 0; }
}
$("wd-last").addEventListener("input", wdRefresh);
$("wd-dest").addEventListener("change", wdRefresh);
$("wd-chips").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { $("wd-amt").value = b.dataset.a; wdRefresh(); } });
$("wd-go").onclick = () => {
  const T = WD[lang], a = avail(), amt = Math.min(a, Math.max(0, Math.round(+$("wd-amt").value || 0)));
  const last = $("wd-last").value.trim(), dest = $("wd-dest").value;
  if (!(amt > 0) || $("wd-type").value.trim() !== T.phrase || !/^\d{4}$/.test(last)) return;
  const destName = (T.dests.find(d => d[0] === dest) || ["", dest])[1] + " •••• " + last;
  try {
    localStorage.setItem("mira_topup", String(a - amt));
    const log = JSON.parse(localStorage.getItem("mira_withdrawals") || "[]");
    log.push({ t: new Date().toISOString(), amount: amt, dest: dest, last4: last });
    localStorage.setItem("mira_wd_dest", dest);
    localStorage.setItem("mira_withdrawals", JSON.stringify(log));
  } catch (e) {}
  wdClose(); dpScan(); render(); renderNotes();
  const t = $("toast"); t.textContent = T.done(fmt(amt), destName); t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600);
};

let mvDir = "in";
function mvDate(d){ return d ? d.toLocaleDateString(lang==="th"?"th-TH":"en-GB",{day:"numeric",month:"long",year:"numeric"}) : ""; }
function renderPorts(){
  const W = window.MiraWallet; if(!W || !$("ports")) return;
  const T = MV[lang], c = Math.round(W.central()), iv = Math.round(W.invest()), wd = Math.floor(W.withdrawable()), L = W.lending();
  $("ports").innerHTML =
    `<div class="port"><div><h4>${T.c}</h4><div class="sub2">${T.cSub}</div></div><div class="amt">฿${fmt(c)}</div>
       <div class="acts2"><a href="#" data-dp>${T.topup}</a><button class="p" id="mv-in" ${c<=0?"disabled":""}>${T.toI}</button></div></div>` +
    `<div class="port"><div><h4>${T.i}</h4><div class="sub2">${T.iSub(fmt(wd))}</div></div><div class="amt">฿${fmt(iv)}</div>
       <div class="acts2"><button id="mv-out" ${iv<=0?"disabled":""}>${T.fromI}</button><a href="investment.html">${T.detail}</a></div></div>` +
    `<div class="port"><div><h4>${T.l}</h4><div class="sub2">${T.lSub(fmt(L.locked),fmt(L.waiting),fmt(L.accrued))}</div></div><div class="amt">฿${fmt(L.total)}</div>
       <div class="acts2"><a href="lender.html">${T.lendGo}</a></div></div>`;
  $("mv-in").onclick = ()=>mvOpen("in"); $("mv-out").onclick = ()=>mvOpen("out");
}
function mvMax(){ const W=MiraWallet; return mvDir==="in" ? Math.floor(W.central()) : Math.floor(W.invest()); }
function mvRefresh(){
  const T = MV[lang];
  $("mv-title").textContent = mvDir==="in"?T.inT:T.outT; $("mv-sub").textContent = mvDir==="in"?T.inS:T.outS;
  $("mv-lbl").textContent = T.amt; $("mv-cancel").textContent = T.cancel; $("mv-go").textContent = T.confirm;
  const m = mvMax();
  $("mv-chips").innerHTML = [500,1000,5000].filter(v=>v<m).map(v=>`<button type="button" data-a="${v}">฿${fmt(v)}</button>`).join("") + `<button type="button" data-a="${m}">${T.max} ฿${fmt(m)}</button>`;
}
function mvOpen(dir){ mvDir = dir; $("mv-amt").value = ""; $("mv-msg").innerHTML = ""; $("mv-modal").hidden = false; mvRefresh(); $("mv-amt").focus(); }
function mvClose(){ $("mv-modal").hidden = true; }
$("mv-cancel").onclick = mvClose;
$("mv-modal").addEventListener("click", e=>{ if(e.target.id==="mv-modal") mvClose(); });
$("mv-chips").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) $("mv-amt").value=b.dataset.a; });
$("mv-go").onclick = ()=>{
  const T = MV[lang], W = MiraWallet, a = Math.round(+$("mv-amt").value||0), msg = $("mv-msg");
  const r = mvDir==="in" ? W.toInvest(a) : W.fromInvest(a);
  if(r.ok){
    msg.innerHTML = `<div class="mv-ok">${mvDir==="in"?T.okIn(fmt(a)):T.okOut(fmt(a))}</div>`;
    render(); renderNotes(); mvRefresh(); $("mv-amt").value = "";
    return;
  }
  let t = T.errAmt;
  if(r.error==="central") t = T.errCentral(fmt(r.max));
  if(r.error==="exceeds") t = T.errExceeds(fmt(r.max));
  if(r.error==="wait") t = T.errWait(fmt(r.canNow), mvDate(r.fullAt));
  msg.innerHTML = `<div class="mv-err">${t}</div>`;
};
