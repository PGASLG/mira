# Mira Fund Engine: daily NAV update. PAPER (simulated) money only.
# Needs repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (see docs/HANDOVER.md). Never commit keys.
name: daily-nav
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC Mon-Fri = after the US close in both summer and winter time
  workflow_dispatch: {}
concurrency:
  group: daily-nav
  cancel-in-progress: false
jobs:
  nav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Run model and update NAV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python engine/daily_job.py --sink supabase
